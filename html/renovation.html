<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装修规划 · 成年人的游乐园</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f0;
            color: #222;
            line-height: 1.68;
            display: flex;
            min-height: 100vh;
        }

        /* ===== 左侧导航栏 ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 270px;
            height: 100vh;
            background: #1a1a1a;
            color: #ccc;
            overflow-y: auto;
            padding: 28px 18px 50px;
            z-index: 10;
            border-right: 1px solid #333;
            transition: transform 0.25s ease;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-list {
            list-style: none;
            padding: 0;
        }

        .nav-item {
            margin: 2px 0;
        }

        .nav-link {
            display: block;
            padding: 6px 10px 6px 14px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            border-left: 3px solid transparent;
            border-radius: 0 4px 4px 0;
            transition: all 0.15s;
            cursor: pointer;
            word-break: break-word;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.07);
            border-left-color: #ffb347;
        }

        .nav-link.active {
            color: #ffb347;
            background: rgba(255, 180, 70, 0.09);
            border-left-color: #ffb347;
            font-weight: 550;
        }

        .nav-link.level-2 { padding-left: 22px; }
        .nav-link.level-3 { padding-left: 42px; font-size: 12.5px; color: #888; }

        /* ===== 右侧主内容区 ===== */
        .main-content {
            margin-left: 290px;
            flex: 1;
            padding: 44px 58px 90px;
            max-width: 980px;
        }

        @media (max-width: 860px) {
            .sidebar {
                transform: translateX(-100%);
                width: 250px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 36px 22px 66px;
            }

            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            align-items: center;
            justify-content: center;
        }

        /* ===== Markdown 渲染样式 ===== */
        .content h2 {
            font-size: 27px;
            font-weight: 680;
            margin-top: 54px;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
            color: #111;
        }

        .content h2:first-of-type {
            margin-top: 0;
        }

        .content h3 {
            font-size: 20px;
            font-weight: 620;
            margin-top: 36px;
            margin-bottom: 12px;
            color: #222;
        }

        .content h4 {
            font-size: 17px;
            font-weight: 600;
            margin-top: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .content p {
            margin: 14px 0;
            font-size: 15.5px;
            color: #333;
        }

        .content ul, .content ol {
            margin: 12px 0 12px 28px;
        }

        .content li {
            margin: 6px 0;
            font-size: 15px;
        }

        .content strong {
            color: #000;
        }

        .content blockquote {
            margin: 18px 0;
            padding: 14px 22px;
            background: #edeae3;
            border-left: 5px solid #d49a5a;
            font-style: normal;
            color: #444;
            border-radius: 0 8px 8px 0;
        }

        .content code {
            background: #e8e6e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-family: "SF Mono", Menlo, monospace;
        }

        .content a {
            color: #d49a5a;
            text-decoration: underline;
            word-break: break-all;
        }

        .content a:hover {
            color: #ffb347;
        }

        .content hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #ccc;
        }

        /* 特殊标记：重要 / 必须 */
        .content .tag-important {
            display: inline-block;
            background: #ffb347;
            color: #1a1a1a;
            font-size: 11px;
            font-weight: 630;
            padding: 1px 12px;
            border-radius: 14px;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* 风格标签点缀 */
        .content .style-tag {
            display: inline-block;
            background: #3a3a3a;
            color: #eee;
            font-size: 11px;
            font-weight: 400;
            padding: 1px 10px;
            border-radius: 12px;
            margin: 0 4px;
        }

        /* ===== 锚点偏移补偿 ===== */
        .anchor-offset {
            scroll-margin-top: 28px;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 72px;
            padding-top: 24px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>

<script>

    // ============================================================
    //  2. 简易 Markdown → HTML 转换器
    // ============================================================
    function mdToHtml(md) {
        let lines = md.split('\n');
        let html = '';
        let inUl = false;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];

            // 空行
            if (line.trim() === '') {
                if (inUl) { html += '</ul>\n'; inUl = false; }
                continue;
            }

            // 标题
            const hMatch = line.match(/^(#{1,6})\s+(.+)/);
            if (hMatch) {
                if (inUl) { html += '</ul>\n'; inUl = false; }
                const level = hMatch[1].length;
                const text = hMatch[2];
                const id = slugify(text);
                html += `<h${level} id="${id}" class="anchor-offset">${inlineMd(text)}</h${level}>\n`;
                continue;
            }

            // 无序列表
            const ulMatch = line.match(/^[-*+]\s+(.+)/);
            if (ulMatch) {
                if (!inUl) { html += '<ul>\n'; inUl = true; }
                html += `<li>${inlineMd(ulMatch[1])}</li>\n`;
                continue;
            }

            // 有序列表 (简单处理为段落)
            const olMatch = line.match(/^\d+\.\s+(.+)/);
            if (olMatch) {
                if (inUl) { html += '</ul>\n'; inUl = false; }
                html += `<p>${inlineMd(line)}</p>\n`;
                continue;
            }

            // 引用
            const bqMatch = line.match(/^>\s?(.*)/);
            if (bqMatch) {
                if (inUl) { html += '</ul>\n'; inUl = false; }
                html += `<blockquote>${inlineMd(bqMatch[1])}</blockquote>\n`;
                continue;
            }

            // 分割线
            if (/^---+$/.test(line.trim())) {
                if (inUl) { html += '</ul>\n'; inUl = false; }
                html += '<hr>\n';
                continue;
            }

            // 普通段落
            if (inUl) { html += '</ul>\n'; inUl = false; }
            html += `<p>${inlineMd(line)}</p>\n`;
        }

        if (inUl) html += '</ul>\n';
        return html;
    }

    // 行内格式化
    function inlineMd(text) {
        // 粗体 **text**
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // 行内代码 `code`
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        // 链接 [text](url)
        text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        // 普通URL
        text = text.replace(/(?<!["\w])(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
        // 特殊标记 (重要)
        text = text.replace(/\(重要\)/g, '<span class="tag-important">重要</span>');
        text = text.replace(/\(必须\)/g, '<span class="tag-important">必须</span>');
        return text;
    }

    // 生成 slug ID
    function slugify(text) {
        return text
            .replace(/[、，。！？·：；""''（）【】《》\s]+/g, '-')
            .replace(/[^\w\u4e00-\u9fa5\-]/g, '')
            .replace(/^-+|-+$/g, '')
            .toLowerCase() || 'section';
    }

    // ============================================================
    //  3. 提取大纲（标题层级）
    // ============================================================
    function extractTOC(md) {
        const lines = md.split('\n');
        const toc = [];
        lines.forEach(line => {
            const match = line.match(/^(#{2,4})\s+(.+)/);
            if (match) {
                const level = match[1].length;
                const title = match[2].trim();
                const id = slugify(title);
                toc.push({ level, title, id });
            }
        });
        return toc;
    }

    // ============================================================
    //  4. 渲染导航栏
    // ============================================================
    function renderNav(toc) {
        const navList = document.getElementById('navList');
        navList.innerHTML = '';
        toc.forEach(item => {
            const li = document.createElement('li');
            li.className = 'nav-item';
            const a = document.createElement('a');
            a.className = `nav-link level-${item.level}`;
            a.href = `#${item.id}`;
            a.textContent = item.title;
            a.dataset.targetId = item.id;
            li.appendChild(a);
            navList.appendChild(li);
        });
    }

    // ============================================================
    //  5. 渲染正文
    // ============================================================
    function renderContent(md) {
        const area = document.getElementById('contentArea');
        area.innerHTML = mdToHtml(md);
    }

    // ============================================================
    //  6. 滚动监听 – 高亮当前导航项
    // ============================================================
    function setupScrollSpy() {
        const links = document.querySelectorAll('.nav-link');
        const headings = document.querySelectorAll('.content h2, .content h3, .content h4');

        function updateActive() {
            let currentId = '';
            const scrollPos = window.scrollY + 130;

            headings.forEach(h => {
                if (h.offsetTop <= scrollPos) {
                    currentId = h.id;
                }
            });

            links.forEach(link => {
                link.classList.remove('active');
                if (link.dataset.targetId === currentId) {
                    link.classList.add('active');
                    // 确保导航项在可视区域
                    link.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            });
        }

        window.addEventListener('scroll', updateActive);
        window.addEventListener('resize', updateActive);
        setTimeout(updateActive, 300);
    }

    // ============================================================
    //  7. 移动端菜单切换
    // ============================================================
    function setupMobileMenu() {
        const btn = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        btn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 860) {
                    sidebar.classList.remove('open');
                }
            });
        });
    }

    // ============================================================
    //  8. 启动！
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        const toc = extractTOC(markdownRaw);
        renderNav(toc);
        renderContent(markdownRaw);
        setupScrollSpy();
        setupMobileMenu();
    });
</script>
